<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#128c7e">
<meta name="mobile-web-app-capable" content="yes">
<title>Cadastro de Cliente</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--tx:#1b1f23;--mut:#5f6b76;--bd:#d5dbe1;--pri:#128c7e;--priTx:#fff;--err:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101418;--card:#1a2026;--tx:#eef1f4;--mut:#9aa7b3;--bd:#33404b;--pri:#25d366;--priTx:#06230f;--err:#ff7b72}}
:root[data-theme="dark"]{--bg:#101418;--card:#1a2026;--tx:#eef1f4;--mut:#9aa7b3;--bd:#33404b;--pri:#25d366;--priTx:#06230f;--err:#ff7b72}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background-color:var(--bg)}
header{background:var(--pri);color:var(--priTx);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:18px;margin:0}
header button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:6px 10px;font-size:14px}
main{max-width:560px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0 0 10px}
label{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}
input,select{width:100%;padding:12px;font-size:16px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
input:focus,select:focus{outline:2px solid var(--pri);border-color:transparent}
.row{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.bad{border-color:var(--err)}
.msg{color:var(--err);font-size:13px;min-height:18px;margin-top:6px}
.btn{width:100%;padding:15px;font-size:17px;font-weight:700;border:0;border-radius:12px;background:var(--pri);color:var(--priTx);margin-top:6px}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--bd);font-weight:500;font-size:15px}
.cov{display:none;margin-top:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);font-size:14px;line-height:1.45;color:var(--tx)}
.cov.show{display:block}
.cov.ok{background:rgba(37,211,102,.16);border-color:#25a05a}
.cov.bad{background:rgba(229,57,53,.14);border-color:#d32f2f}
.cov.warn,.cov.info{background:rgba(255,167,38,.16);border-color:#e69100}
.btn.chk{margin-top:10px;padding:11px;font-size:15px}
#cfg{display:none}
#cfg.on{display:block}
small{color:var(--mut)}
</style>
</head>
<body>
<header><h1>Cadastro de Cliente</h1><button type="button" id="gear">Supervisor</button></header>
<main>
<div class="card" id="cfg">
<h2>WhatsApp do supervisor</h2>
<label for="sup">Número com DDD</label>
<input id="sup" inputmode="tel" placeholder="(48) 99999-9999" autocomplete="off">
<small>Salvo neste aparelho. Se ficar vazio, o WhatsApp pergunta para quem enviar.</small>
<button type="button" class="btn sec" id="saveSup">Salvar número</button>
</div>

<div class="card">
<h2>Dados pessoais</h2>
<label for="nome">Nome completo</label>
<input id="nome" autocomplete="off" autocapitalize="words">
<label for="cpf">CPF</label>
<input id="cpf" inputmode="numeric" placeholder="000.000.000-00" maxlength="14" autocomplete="off">
<h2 style="margin-top:18px">Contato</h2>
<label for="tel">Telefone / WhatsApp</label>
<input id="tel" inputmode="tel" placeholder="(48) 99999-9999" maxlength="15" autocomplete="off">
<label for="email">E-mail</label>
<input id="email" type="email" inputmode="email" autocapitalize="none" autocomplete="off">
</div>

<div class="card">
<h2>Endereço</h2>
<label for="end">Endereço completo</label>
<input id="end" placeholder="Rua, número, complemento, bairro, cidade" autocomplete="off">
<div class="row">
<div><label for="cep">CEP</label><input id="cep" inputmode="numeric" placeholder="00000-000" maxlength="9" autocomplete="off"></div>
<div><label for="uf">UF</label>
<select id="uf"><option value="">—</option></select></div>
</div>
<label for="num">Número do imóvel (para a consulta)</label>
<input id="num" inputmode="numeric" placeholder="Ex.: 109" autocomplete="off">
<label for="comp">Complemento (casa, apto, bloco)</label>
<input id="comp" placeholder="Ex.: Casa ou Apto 12 Bloco B" autocomplete="off">
<button type="button" class="btn sec chk" id="openNio">Confirmar no site da Nio</button>
<div class="cov" id="cov" role="status"></div>
<label for="covSel">Resultado da consulta</label>
<select id="covSel"><option value="">Não consultado</option><option>COM COBERTURA DE FIBRA</option><option>SEM COBERTURA</option></select>
</div>

<div class="card">
<h2>Contratação</h2>
<label for="plano">Plano</label>
<select id="plano"><option value="">Selecione</option><option>Nio Fibra - 600 Mega - R$ 55/mês</option><option>Nio Essencial - 800 Mega + 10 GB - R$ 70/mês</option><option>Nio Super - 1 Giga + 20 GB + Globoplay - R$ 85/mês</option><option>Nio Ultra - 1 Giga + 2 chips 20 GB + Globoplay + Ponto extra - R$ 100/mês</option></select>
<label for="pag">Forma de pagamento</label>
<select id="pag"><option value="">Selecione</option><option>Boleto</option><option>Cartão de crédito</option><option>Débito automático</option><option>Pix</option></select>
<label for="turno">Turno de instalação</label>
<select id="turno"><option value="">Selecione</option><option>Manhã</option><option>Tarde</option></select>
</div>

<div class="msg" id="msg" role="alert"></div>
<button type="button" class="btn" id="send">Enviar pelo WhatsApp</button>
<button type="button" class="btn sec" id="clear">Limpar formulário</button>
<p style="height:24px"></p>
</main>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var F=["nome","cpf","tel","email","end","cep","uf","plano","pag","turno"];
var UFS="AC AL AP AM BA CE DF ES GO MA MT MS MG PA PB PR PE PI RJ RN RS RO RR SC SP SE TO".split(" ");
UFS.forEach(function(u){var o=document.createElement("option");o.value=o.textContent=u;$("uf").appendChild(o)});

function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}return null}
function digits(s){return (s||"").replace(/\D/g,"")}

function mask(id,fn){$(id).addEventListener("input",function(e){e.target.value=fn(digits(e.target.value))})}
function mCpf(d){d=d.slice(0,11);return d.replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d{1,2})$/,"$1-$2")}
function mTel(d){d=d.slice(0,11);if(d.length<=2)return d?"("+d:"";if(d.length<=6)return "("+d.slice(0,2)+") "+d.slice(2);if(d.length<=10)return "("+d.slice(0,2)+") "+d.slice(2,6)+"-"+d.slice(6);return "("+d.slice(0,2)+") "+d.slice(2,7)+"-"+d.slice(7)}
function mCep(d){d=d.slice(0,8);return d.length>5?d.slice(0,5)+"-"+d.slice(5):d}
mask("cpf",mCpf);mask("tel",mTel);mask("cep",mCep);mask("sup",mTel);

function cpfOk(c){c=digits(c);if(c.length!==11||/^(\d)\1+$/.test(c))return false;
for(var t=9;t<11;t++){var s=0;for(var i=0;i<t;i++)s+=c[i]*(t+1-i);var r=(s*10)%11%10;if(r!=c[t])return false}return true}

var X=["num","comp","covSel"];
function save(){var o={};F.concat(X).forEach(function(f){o[f]=$(f).value});ls("draft",JSON.stringify(o))}
F.concat(X).forEach(function(f){$(f).addEventListener("input",save);$(f).addEventListener("change",save)});
try{var d=JSON.parse(ls("draft")||"{}");F.concat(X).forEach(function(f){if(d[f])$(f).value=d[f]})}catch(e){}
$("sup").value=ls("sup")||"";

$("gear").onclick=function(){$("cfg").classList.toggle("on")};
$("saveSup").onclick=function(){
var d=digits($("sup").value);
if(d&&d.length<10){alert("Número inválido. Use DDD + número.");return}
ls("sup",d||null);$("cfg").classList.remove("on");
};
if(!ls("sup"))$("cfg").classList.add("on");

$("clear").onclick=function(){if(confirm("Limpar todos os campos?")){$("num").value="";$("comp").value="";$("covSel").value="";covHide();F.forEach(function(f){$(f).value="";$(f).classList.remove("bad")});ls("draft",null);$("msg").textContent=""}};

var cityNio="";
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function norm(t){return (t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase()}
function covShow(cls,html){var b=$("cov");b.className="cov show "+cls;b.innerHTML=html}
function covHide(){var b=$("cov");b.className="cov";b.innerHTML="";cityNio="";ls("cepinfo",null)}
var lastAuto="";
function applyCep(d){
cityNio=norm(d.localidade);
if(d.uf)$("uf").value=d.uf;
var line=[d.logradouro,d.bairro,d.localidade].filter(Boolean).join(", ");
var cur=$("end").value.trim();
if(line&&(!cur||cur===lastAuto)){$("end").value=line;lastAuto=line}
save();
var html="<b>Endereço encontrado</b><br>"+esc([d.logradouro,d.bairro,(d.localidade||"")+"-"+(d.uf||"")].filter(Boolean).join(", "))+"<br>Agora toque em <b>Confirmar no site da Nio</b> para ver a cobertura do número exato.";
covShow("ok",html);
ls("cepinfo",JSON.stringify({c:digits($("cep").value),city:cityNio,auto:lastAuto,html:html}));
}
function lookupCep(){
var c=digits($("cep").value);
if(c.length!==8)return;
covShow("info","Buscando endereço...");
function viacep(){return fetch("https://viacep.com.br/ws/"+c+"/json/").then(function(r){if(!r.ok)throw new Error("erro "+r.status);return r.json()}).then(function(j){if(j.erro)throw new Error("CEP não encontrado");return {logradouro:j.logradouro,bairro:j.bairro,localidade:j.localidade,uf:j.uf}})}
function brasil(){return fetch("https://brasilapi.com.br/api/cep/v2/"+c).then(function(r){if(!r.ok)throw new Error("CEP não encontrado");return r.json()}).then(function(j){return {logradouro:j.street,bairro:j.neighborhood,localidade:j.city,uf:j.state}})}
viacep().catch(brasil).then(function(d){if(digits($("cep").value)!==c)return;applyCep(d)})
.catch(function(e){if(digits($("cep").value)!==c)return;covShow("warn","Não foi possível buscar o endereço ("+esc(e.message)+"). Você ainda pode confirmar no site da Nio.")});
}
$("cep").addEventListener("input",function(){var n=digits($("cep").value).length;if(n===8)lookupCep();else covHide()});
(function(){
var c=digits($("cep").value);
if(c.length!==8)return;
var info=null;try{info=JSON.parse(ls("cepinfo")||"null")}catch(e){}
if(info&&info.c===c){cityNio=info.city||"";lastAuto=info.auto||"";covShow("ok",info.html)}
else lookupCep();
})();
$("openNio").onclick=function(){
var c=digits($("cep").value);
if(c.length!==8){covShow("warn","Digite o CEP com 8 dígitos.");$("cep").focus();return}
var q=["postCode="+c];
var n=$("num").value.trim();if(n)q.push("number="+encodeURIComponent(n));
var cp=$("comp").value.trim();if(cp)q.push("complement="+encodeURIComponent(cp));
if(cityNio)q.push("city="+encodeURIComponent(cityNio));
if($("uf").value)q.push("stateOrProvince="+encodeURIComponent($("uf").value));
window.location.href="https://checkout.niointernet.com.br/?"+q.join("&");
};
$("send").onclick=function(){
var v={};F.forEach(function(f){v[f]=$(f).value.trim();$(f).classList.remove("bad")});
var miss=[];
F.forEach(function(f){if(!v[f]){miss.push(f)}});
var errs=[];
if(v.cpf&&!cpfOk(v.cpf)){miss.push("cpf");errs.push("CPF inválido")}
if(v.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)){miss.push("email");errs.push("E-mail inválido")}
if(v.cep&&digits(v.cep).length!==8){miss.push("cep");errs.push("CEP incompleto")}
if(v.tel&&digits(v.tel).length<10){miss.push("tel");errs.push("Telefone incompleto")}
if(miss.length){
miss.forEach(function(f){$(f).classList.add("bad")});
var empty=F.filter(function(f){return !v[f]}).length;
$("msg").textContent=(empty?"Preencha todos os campos ("+empty+" faltando). ":"")+errs.join(". ");
$(miss[0]).focus();return}
$("msg").textContent="";
var t="*NOVO CADASTRO*\n\n"+
"*Nome completo:* "+v.nome+"\n"+
"*CPF:* "+v.cpf+"\n\n"+
"*CONTATO:* "+v.tel+"\n"+
"*EMAIL:* "+v.email+"\n\n"+
"*Endereço completo:* "+v.end+"\n"+
"*CEP:* "+v.cep+"\n"+
"*UF:* "+v.uf+"\n\n"+
"*PLANO:* "+v.plano+"\n"+
"*FORMA DE PAGAMENTO:* "+v.pag+"\n"+
"*TURNO DE INSTALAÇÃO:* "+v.turno+($("covSel").value?"\n*COBERTURA:* "+$("covSel").value:"");
var n=digits(ls("sup")||"");
if(n&&n.length<=11)n="55"+n;
var url="https://wa.me/"+n+"?text="+encodeURIComponent(t);
window.location.href=url;
};
})();
</script>
</body>
</html>
